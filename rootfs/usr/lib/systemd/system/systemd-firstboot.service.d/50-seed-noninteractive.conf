# Image mode systems are provisioned non-interactively (bootc install,
# Ignition, cloud-init, systemd credentials), so never block the first boot
# on console prompts. Settings passed as credentials (firstboot.*,
# passwd.*.root) still apply.
[Service]
ExecStart=
ExecStart=systemd-firstboot
StandardInput=null
StandardOutput=journal+console
StandardError=journal+console
TTYReset=no
