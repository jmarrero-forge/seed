# Targets of the toplevel symlinks created at build time (e.g. /home -> var/home);
# the image's root is read-only, so writable state lives in /var and /run.
d /var/home 0755 root root -
d /var/roothome 0700 root root -
d /var/srv 0755 root root -
d /var/mnt 0755 root root -
d /run/media 0755 root root -
