# /var content in the image is only applied at initial install, so every
# directory packages leave there must also be declared here to exist after
# upgrades. rpm-ostree generated these automatically ("autovar"); here they
# are explicit, and `bootc container lint --fatal-warnings` in the build fails
# when the package set changes them.
#
# bootc has the conversion logic (bootc_tmpfiles::var_to_tmpfiles) but does
# not expose it on the CLI yet; once it does, this file can be generated.

# filesystem
d /var/adm 0755 root root - -
d /var/cache/bpf 0755 root root - -
d /var/db 0755 root root - -
d /var/empty 0755 root root - -
d /var/ftp 0755 root root - -
d /var/games 0755 root root - -
d /var/lib/games 0755 root root - -
d /var/lib/misc 0755 root root - -
d /var/lib/rpm-state 0755 root root - -
d /var/local 0755 root root - -
L /var/mail - - - - spool/mail
d /var/nis 0755 root root - -
d /var/opt 0755 root root - -
d /var/preserve 0755 root root - -
d /var/spool/lpd 0755 root root - -
d /var/spool/mail 0775 root mail - -
d /var/yp 0755 root root - -

# authselect-libs
d /var/lib/authselect 0755 root root - -
# containers-common
d /var/lib/containers 0755 root root - -
d /var/lib/containers/sigstore 0755 root root - -
# dracut
d /var/lib/initramfs 0755 root root - -
# glibc
d /var/cache/ldconfig 0700 root root - -
# krb5-libs
d /var/kerberos 0755 root root - -
d /var/kerberos/krb5 0755 root root - -
d /var/kerberos/krb5/user 0755 root root - -
# systemd
d /var/lib/systemd/catalog 0755 root root - -

# The SELinux module store is moved to /etc at build time (see Containerfile).
L /var/lib/selinux - - - - ../../etc/selinux
