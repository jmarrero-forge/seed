# Complements 10-bootc-base.conf, which bootc ships in
# /usr/share/doc/bootc/baseimage/dracut.

# dracut can't set security.selinux xattrs in a container build;
# https://github.com/dracut-ng/dracut-ng/issues/1561
export DRACUT_NO_XATTR=1
# Allow booting with the root filesystem on virtiofs, e.g. `bcvk ephemeral`.
add_dracutmodules+=" virtiofs "
